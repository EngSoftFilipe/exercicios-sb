<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="icon" type="image/svg+xml" href="/favicon/enviar.svg">
    <style>
        body {
            background-color: #202124;
        }
        h1 {
            color: #fff;
        }
        input, button {
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Formulário</h1>

    <!-- Formulário padrão só aceita GET e POST --> 
    <form method="post" action="/api/produtos">
        <input name="nome" placeholder="Nome do produto" required>
        <input name="preco" type="number" step="0.01" placeholder="Preço do produto" required>
        <button>Enviar</button>
    </form>
</body>
</html>
